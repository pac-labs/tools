name: Build PACDIAG PDF report

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Directory or text file containing PACDIAG bundles / legacy scan output'
        required: true
        default: 'diagnostics/input'
        type: string
      offline:
        description: 'Do not perform live version lookups; use embedded version baseline'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'diagnostics/input/**'
      - 'report.py'
      - '.github/workflows/build-diagnostic-report.yml'

permissions:
  contents: read

concurrency:
  group: pacdiag-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-report:
    name: Generate readiness + hardware PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install PDF dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve diagnostic input
        id: input
        shell: bash
        env:
          MANUAL_INPUT: ${{ github.event.inputs.input_path }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            input_path="${MANUAL_INPUT:-diagnostics/input}"
          else
            input_path="diagnostics/input"
          fi

          if [[ ! -e "$input_path" ]]; then
            echo "Diagnostic input does not exist: $input_path" >&2
            exit 2
          fi

          echo "path=$input_path" >> "$GITHUB_OUTPUT"
          echo "Using diagnostic input: $input_path"

      - name: Generate PACDIAG report
        id: report
        shell: bash
        env:
          INPUT_PATH: ${{ steps.input.outputs.path }}
          OFFLINE: ${{ github.event.inputs.offline }}
        run: |
          set +e

          args=("$INPUT_PATH" -o diagnostics/generated)
          if [[ "$OFFLINE" == "true" ]]; then
            args+=(--offline)
          fi

          python report.py "${args[@]}"
          rc=$?

          # report.py intentionally returns 1 when production-readiness blockers
          # are found. That is a valid diagnostic result and must still publish.
          if [[ $rc -gt 1 ]]; then
            echo "report.py failed with exit code $rc" >&2
            exit "$rc"
          fi

          echo "readiness_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify PDFs were created
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/generated/environment-report.pdf
          test -s diagnostics/generated/hardware-report.pdf
          ls -lh diagnostics/generated/environment-report.pdf diagnostics/generated/hardware-report.pdf

      - name: Write workflow summary
        shell: bash
        env:
          READINESS_RC: ${{ steps.report.outputs.readiness_exit_code }}
        run: |
          {
            echo '## PACDIAG environment report'
            echo
            if [[ "$READINESS_RC" == "1" ]]; then
              echo 'The report was generated successfully and contains one or more production-readiness blockers.'
            else
              echo 'The report was generated successfully without a blocking readiness verdict.'
            fi
            echo
            echo 'Download **hardware-report.pdf** for the hardware/topology view and **environment-report.pdf** for Ceph/OpenStack readiness.'
            echo
            echo 'Additional machine-readable and HTML/Markdown outputs are included in the full report artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness PDF
        uses: actions/upload-artifact@v7
        with:
          path: diagnostics/generated/environment-report.pdf
          archive: false
          retention-days: 30

      - name: Upload hardware PDF
        uses: actions/upload-artifact@v7
        with:
          path: diagnostics/generated/hardware-report.pdf
          archive: false
          retention-days: 30

      - name: Upload full report bundle
        uses: actions/upload-artifact@v7
        with:
          name: pacdiag-full-report
          path: |
            diagnostics/generated/environment-report.html
            diagnostics/generated/environment-report.md
            diagnostics/generated/hardware-report.html
            diagnostics/generated/hardware-report.md
            diagnostics/generated/environment-data.json
          if-no-files-found: error
          retention-days: 30
